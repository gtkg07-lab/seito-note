<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a4d9b">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="進捗ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>生徒進捗ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 上部に固定のタブ、その下にフィルタ、本文は生徒ごとの行カードと集計タイル。最大幅1120px */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --sunk:#eef1f7;
  --ink:#1b2233; --ink-2:#465068; --muted:#737c92; --line:#dde2ec;
  --accent:#2a4d9b; --accent-ink:#ffffff; --accent-soft:#e5ebf8;
  --good:#1d7a46; --good-soft:#e2f3e8; --bad:#b3342b; --bad-soft:#fbe7e4; --warn:#9a6200; --warn-soft:#fbf0d9;
  --bar:#4a6fc4; --today-bg:#fff4d6; --today-ink:#b26a00;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131a; --surface:#181c26; --sunk:#1f2431;
  --ink:#e6e9f1; --ink-2:#b4bbcb; --muted:#8a92a6; --line:#2b3242;
  --accent:#8eaaf0; --accent-ink:#0f1730; --accent-soft:#223155;
  --good:#5cc489; --good-soft:#173325; --bad:#f07c71; --bad-soft:#3a1d1b; --warn:#e3ab4c; --warn-soft:#352812;
  --bar:#7d9de6; --today-bg:#3a2f12; --today-ink:#f2b84b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#181c26; --sunk:#1f2431;
  --ink:#e6e9f1; --ink-2:#b4bbcb; --muted:#8a92a6; --line:#2b3242;
  --accent:#8eaaf0; --accent-ink:#0f1730; --accent-soft:#223155;
  --good:#5cc489; --good-soft:#173325; --bad:#f07c71; --bad-soft:#3a1d1b; --warn:#e3ab4c; --warn-soft:#352812;
  --bar:#7d9de6; --today-bg:#3a2f12; --today-ink:#f2b84b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.save{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--good)} .save.busy i{background:var(--warn)} .save.err i{background:var(--bad)} .save.err{color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;white-space:nowrap;color:var(--ink-2);font-weight:700}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:not([aria-selected="true"]):hover{background:var(--sunk)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:14px 4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;min-width:0;width:180px}
.fcount{font-size:12px;color:var(--muted)}

.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner.err{background:var(--bad-soft);color:var(--bad)}

h2{font-size:18px;margin:22px 0 4px;text-wrap:balance}
.lead{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
.toolbar .sep{flex:1}
/* 日付の操作欄はスクロールしても上に残る（生徒の行はその下に隠れていく） */
.toolbar.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,96px));z-index:4;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line);box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.date{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px}
.range{font-size:13px;color:var(--ink-2)}
.totals{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.totals b{color:var(--ink);font-family:var(--f-num);font-size:15px}

/* 入力カード */
.list{display:flex;flex-direction:column;gap:8px}
.gradehead{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:10px 2px 0}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:150px auto 1fr;gap:10px 16px;align-items:start}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who b{font-size:15px;overflow-wrap:anywhere}
.grade{font-size:11px;color:var(--muted)}
.grp{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.cols{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:11px;font-weight:700;color:var(--muted);width:44px;flex:none}
.step{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:3px 4px 3px 10px;min-width:0}
.step .nm{font-size:12px;color:var(--ink-2);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1;padding:0}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:1.6em;text-align:center;font-family:var(--f-num);font-weight:500}
.step output.z{color:var(--muted)}
.kgrp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:4px 6px 4px 10px;min-width:0}
.kgrp .nm{font-size:12px;color:var(--ink-2);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kgrp small{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.kc{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 2px 2px 8px;font-size:12px;white-space:nowrap}
.kc b{color:var(--warn)}
.kc button{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:4px;padding:0;font-weight:700}
.kc button:hover{background:var(--surface)}
.ksel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12px;max-width:10.5em}
.kadd{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700}
.kadd:disabled,.ksel:disabled{opacity:.45;cursor:not-allowed}
.step small{font-size:11px;color:var(--muted);font-family:var(--f-num);padding-right:6px}
.att{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.att[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.days7{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-start}
.dcell{display:flex;flex-direction:column;gap:3px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.phead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.phead b{font-size:15px}
.phead .totals{margin-left:auto;font-size:12px;gap:10px}
.ptable{margin-top:0;border-radius:8px}
.ptable th,.ptable td{padding:4px 5px;text-align:center}
.ptable th.l,.ptable td.l{text-align:left;white-space:nowrap}
.pn{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 2px;background:var(--bg);font-family:var(--f-num)}
.pa{width:46px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 0;color:var(--muted)}
.pa[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.pa:disabled,.pn:disabled{opacity:.5;cursor:not-allowed}
.tm{width:100%;min-width:56px;font-size:12px;border:1px solid var(--good);border-radius:6px;padding:2px 4px;background:var(--surface);font-family:var(--f-num)}
.days7 button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12px;min-width:56px}
.days7 button[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.final{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.none{font-size:12px;color:var(--muted)}

/* 集計 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-2);font-weight:700}
.tile .v{font-family:var(--f-num);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-family:var(--f-body);margin-left:4px}
.tile .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.d{font-family:var(--f-num);font-weight:500;white-space:nowrap}
.d.up{color:var(--good)} .d.down{color:var(--bad)} .d.flat{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.hm i{background:var(--good)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.panel h3{font-size:14px;margin:0 0 10px}
.chart{display:grid;grid-template-columns:32px 1fr;gap:6px;height:190px}
.yax{position:relative;font-size:11px;color:var(--muted);font-family:var(--f-num)}
.yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.plot .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0;cursor:default;outline:none}
.col .b{width:min(42px,70%);background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.col:hover .b,.col:focus .b{filter:brightness(1.12)}
.col .lab{position:absolute;bottom:calc(var(--h) + 4px);font-size:11px;font-family:var(--f-num);color:var(--ink)}
.xax{display:flex;gap:2px;margin-left:38px;font-size:11px;color:var(--muted);margin-top:4px}
.xax span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;line-height:1.5;max-width:220px}

.tablewrap{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:700;background:var(--sunk);position:sticky;top:0}
th.l,td.l{text-align:left}
td.l b{font-weight:700}
tbody tr:last-child td{border-bottom:0}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
td .of{color:var(--muted);font-size:11px}
.hsub{font-weight:400;font-size:10px;letter-spacing:0}
.cmp{display:inline-grid;grid-template-columns:auto auto auto;align-items:end;column-gap:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cmp .pv{color:var(--muted);font-size:13px}
.cmp .mid{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.cmp .mid .d{font-size:11px}
.cmp .arr{color:var(--muted);font-size:12px}
.cmp .cv{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
.cmp .plan{grid-column:1/-1;text-align:right;font-size:10px;color:var(--muted);font-family:var(--f-body)}
tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line);border-bottom:0}

/* 生徒 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.arch{opacity:.6}
.card .h{display:flex;align-items:center;gap:8px}
.card .h b{font-size:15px;overflow-wrap:anywhere}
.card .h .btn{margin-left:auto}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12px;align-items:center}
.prog .n{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .c{font-family:var(--f-num);color:var(--muted)}
.prog .meter{grid-column:1/-1;margin:0 0 4px}
.rlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rrow{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.rrow .no{font-family:var(--f-num);color:var(--muted);text-align:right}
.rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtns{display:flex;gap:4px}
.rbtns button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:0 6px}
.rbtns button:disabled{opacity:.35;cursor:not-allowed}
.sname{font-weight:700;width:fit-content;max-width:100%}
.sname[style]{color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:1px 7px;border-radius:5px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw.none{width:auto;border-radius:999px;padding:0 10px;background:var(--bg);font-size:12px;color:var(--ink-2)}
.preview{font-size:12px;color:var(--muted);margin-top:4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px;align-items:start}
.rgrid .panel{margin-top:0}
.rnote{font-size:12px;color:var(--muted);margin:-6px 0 6px}
.band{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.band:first-of-type{border-top:0}
.band .bl{font-size:12px;font-weight:700;color:var(--ink-2)}
.band.top .bl{color:var(--accent)}
.band.zero .bl,.band.zero .bn{color:var(--muted);font-weight:400}
.bc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.btrack{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bbar{display:block;height:100%;border-radius:4px;background:var(--bar)}
.band.top .bbar{background:var(--accent)}
.bn{font-family:var(--f-num);font-size:13px;font-weight:700;min-width:3em;text-align:right}
.names{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.nchip{display:inline-flex;align-items:baseline;gap:4px}
.nchip .sname{font-size:12px}
.copybox{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-size:12px;margin-bottom:8px}
@media (max-width:760px){.band{grid-template-columns:1fr}.names{grid-column:1}}
.banner.ok{background:var(--good-soft);color:var(--good)}
.pk .mute,.pk.mute{color:var(--muted)}
.today-panel{margin:4px 0 14px;border-color:var(--today-ink);box-shadow:inset 4px 0 0 var(--today-ink)}
.tphead{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.tphead h3{margin:0;font-size:16px}
.tphead .totals{margin-left:auto}
.tpnav{display:flex;gap:4px}
.tph{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:12px 0 6px}
table.ttable td{vertical-align:top;white-space:normal}
table.ttable tr.tgrp td{border-top:2px solid var(--line)}
table.ttable tbody tr:first-child td{border-top:0}
td.ttime{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--today-ink);white-space:nowrap;width:5.5em}
.tchip{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:1px 8px;margin:1px 4px 1px 0;font-size:12px;white-space:nowrap}
.tchip b{color:var(--accent)}
.tchip.hm{background:var(--good-soft)}
.tchip.hm b{color:var(--good)}
.sbadges{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.sb{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin:1px 3px 1px 0;background:var(--sunk);color:var(--ink-2)}
.sb.bad{background:var(--bad-soft);color:var(--bad)}
.sb.warn{background:var(--warn-soft);color:var(--warn)}
.sb.note{background:var(--today-bg);color:var(--today-ink)}
.sb.ev{background:var(--accent-soft);color:var(--accent)}
.ctb{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.schbox{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.schhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.schrows{display:flex;flex-direction:column;gap:6px}
.schrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.schrow input,.schrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:13px}
.schrow input:not([type=date]){width:11em}
.aitext{white-space:pre-wrap;line-height:1.75;font-size:13.5px;background:var(--sunk);border-radius:8px;padding:12px 14px}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ===== 設定 =====
const UNITS=[{id:'tango',name:'単語',stages:18},{id:'jukugo',name:'熟語',stages:15},{id:'bunpo',name:'文法',stages:15}];
const GRADES=['高0','高1','高2'];
// 生徒の名前に付ける色（l: ライト表示用、d: ダーク表示用）
const COLORS=[
  {id:'red',name:'赤',l:'#c62828',d:'#ff8a80'},{id:'vermilion',name:'朱',l:'#d84315',d:'#ff9e80'},{id:'orange',name:'橙',l:'#b25600',d:'#ffb74d'},
  {id:'mustard',name:'山吹',l:'#8a6a00',d:'#ffd54f'},{id:'lime',name:'黄緑',l:'#4f7f22',d:'#b5dc85'},{id:'green',name:'緑',l:'#2e7d32',d:'#81c784'},
  {id:'teal',name:'青緑',l:'#00786b',d:'#4fd1bf'},{id:'cyan',name:'水色',l:'#0272b0',d:'#62cdf7'},{id:'blue',name:'青',l:'#1e4fd8',d:'#8cafff'},
  {id:'indigo',name:'藍',l:'#4338b8',d:'#aca8ff'},{id:'purple',name:'紫',l:'#7b1fa2',d:'#d29ae0'},{id:'magenta',name:'赤紫',l:'#a3155a',d:'#f28cbf'},
  {id:'pink',name:'桃',l:'#c63f6c',d:'#ffa6c1'},{id:'brown',name:'茶',l:'#7a5240',d:'#d2ae9a'},{id:'gray',name:'灰',l:'#53646e',d:'#b4c2ca'}];
(()=>{const L=COLORS.map(c=>'--sc-'+c.id+':'+c.l).join(';'),D=COLORS.map(c=>'--sc-'+c.id+':'+c.d).join(';');
  const st=document.createElement('style');st.textContent=':root{'+L+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+D+'}}:root[data-theme="dark"]{'+D+'}';document.head.appendChild(st)})();
function sname(s){const c=COLORS.find(x=>x.id===s.color);return '<b class="sname"'+(c?' style="--c:var(--sc-'+c.id+')"':'')+'>'+esc(s.name)+'</b>'}
const FIRST_MONTH='2026-09';
const DOW=['日','月','火','水','木','金','土'];

const S={students:{},pdays:{},days:{},schools:{},schDraft:{},settings:{weekStartDow:1},
  tab:'daily',kpick:{},date:today(),weekStart:null,planStart:null,month:null,
  grade:'all',q:'',showArchived:false,editing:null,editErr:'',
  db:null,canWrite:true,loaded:{students:false,days:false,plans:false}};
try{const t=localStorage.getItem('sn-tab');if(t)S.tab=t;const g=localStorage.getItem('sn-grade');if(g)S.grade=g}catch(e){}

// ===== 日付 =====
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toUTC(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function fromUTC(t){const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(s,n){return fromUTC(toUTC(s)+n*864e5)}
function dow(s){return new Date(toUTC(s)).getUTCDay()}
function md(s){const p=s.split('-');return Number(p[1])+'/'+Number(p[2])}
function fmtDay(s){return md(s)+'('+DOW[dow(s)]+')'}
function weekStartFor(s){const w=Number(S.settings.weekStartDow)||0;return addDays(s,-((dow(s)-w+7)%7))}
function curMonth(){return today().slice(0,7)}
function monthRange(ym){const [y,m]=ym.split('-').map(Number);return [ym+'-01',fromUTC(Date.UTC(y,m,0))]}
function shiftMonth(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)}
function monthLabel(ym){const [y,m]=ym.split('-');return y+'年'+Number(m)+'月'}
function monthList(){const out=[];const last=curMonth()>FIRST_MONTH?curMonth():FIRST_MONTH;let m=FIRST_MONTH;while(m<=last){out.push(m);m=shiftMonth(m,1)}return out}
function rangeDays(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out}

// ===== ユーティリティ =====
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const sumObj=o=>{let t=0;for(const k in o||{})t+=Number(o[k])||0;return t};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function fmtN(n,dig=0){if(n==null||isNaN(n))return '—';return dig?n.toFixed(dig):String(Math.round(n))}
function pct(n){return n==null?'—':(n*100).toFixed(1)+'%'}
function delta(cur,prev,opt={}){
  if(prev==null||cur==null)return '<span class="d flat">—</span>';
  const dig=opt.dig||0;let d=cur-prev;if(Math.abs(d)<1e-9)d=0;
  const unit=opt.unit||'';
  const val=(Math.abs(d)).toFixed(dig)+unit;
  const rate=(!opt.noRate&&prev>0&&d!==0)?' ('+(d>0?'+':'−')+Math.round(Math.abs(d)/prev*100)+'%)':'';
  if(d>0)return '<span class="d up">▲'+val+rate+'</span>';
  if(d<0)return '<span class="d down">▼'+val+rate+'</span>';
  return '<span class="d flat">±0</span>';
}

// ===== 生徒・集計 =====
// 登録順：createdAt。古いデータは id に含まれる登録時刻（36進数）から読み取る
function orderKey(s){if(s.createdAt)return Number(s.createdAt);const t=parseInt(String(s.id||'').slice(1,-4),36);return isNaN(t)?Infinity:t}
// 並び順：自分で並べ替えた順（order）。未設定なら登録順
function sortKey(s){return s.order!=null?Number(s.order):orderKey(s)}
function allStudents(){return Object.values(S.students).sort((a,b)=>(sortKey(a)-sortKey(b))||(orderKey(a)-orderKey(b))||String(a.id).localeCompare(String(b.id)))}
function nextOrder(){const os=Object.values(S.students).map(s=>s.order).filter(o=>o!=null).map(Number);return os.length?Math.max(...os)+1:null}
function visible(){return allStudents().filter(s=>!s.archived&&(S.grade==='all'||s.grade===S.grade)&&(!S.q||String(s.name).includes(S.q)))}
function row(date,sid){return S.days[date]?.rows?.[sid]||null}
function stats(sid,a,b){let lec=0,ex=0,att=0;for(const d in S.days){if(d<a||d>b)continue;const r=S.days[d].rows?.[sid];if(!r)continue;lec+=sumObj(r.courses);ex+=sumObj(r.hm);if(r.attend)att++}return {lec,ex,att}}
// 受講済みコマ数（同じコマを繰り返しても1回と数える。番号なしの古い記録はそのまま足す）
function courseDone(s,c,end){const base=Number(c.baseDone)||0,set=new Set();let legacy=0;
  for(const d in S.days){if(end&&d>end)continue;const r=S.days[d].rows?.[s.id];if(!r)continue;const ks=r.komas?.[c.id]||[];ks.forEach(k=>{if(k>base)set.add(k)});legacy+=Math.max(0,(Number(r.courses?.[c.id])||0)-ks.length)}
  return base+set.size+legacy}
// コマ番号ごとの受講回数（before を渡すとその日より前だけ）
function komaTimes(s,c,before){const cnt={},base=Number(c.baseDone)||0;for(let i=1;i<=base;i++)cnt[i]=1;
  for(const d in S.days){if(before&&d>=before)continue;const ks=S.days[d].rows?.[s.id]?.komas?.[c.id]||[];ks.forEach(k=>cnt[k]=(cnt[k]||0)+1)}return cnt}
function komaInput(s,c,r,D){
  const k=Number(c.koma)||0,ks=r.komas?.[c.id]||[],legacy=Math.max(0,(Number(r.courses?.[c.id])||0)-ks.length);
  const prior=komaTimes(s,c,D),seen={},total=komaTimes(s,c);
  const chips=ks.map((n,i)=>{seen[n]=(seen[n]||0)+1;const nth=(prior[n]||0)+seen[n];
    return '<span class="kc">第'+n+'コマ'+(nth>1?' <b>'+nth+'回目</b>':'')+'<button data-act="kdel" data-sid="'+s.id+'" data-id="'+c.id+'" data-i="'+i+'" aria-label="第'+n+'コマを取り消す"'+(W()?'':' disabled')+'>×</button></span>'}).join('');
  const leg=legacy?'<span class="kc">番号なし '+legacy+'コマ<button data-act="dc" data-sid="'+s.id+'" data-id="'+c.id+'" data-d="-1" aria-label="番号なしを1減らす"'+(W()?'':' disabled')+'>×</button></span>':'';
  const key=s.id+'|'+c.id;let next=1;while(next<=k&&total[next])next++;if(next>k)next=k||1;
  const pick=Number(S.kpick[key])||next;
  const opts=Array.from({length:Math.max(k,1)},(_,i)=>i+1).map(n=>'<option value="'+n+'"'+(n===pick?' selected':'')+'>第'+n+'コマ'+(total[n]?'（済'+total[n]+'回）':'')+'</option>').join('');
  const done=Math.min(courseDone(s,c),k);
  return '<span class="kgrp"><span class="nm" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'+chips+leg+
    '<select class="ksel" id="ks-'+s.id+'-'+c.id+'" data-kpick="'+key+'" aria-label="'+esc(c.name)+'の受講したコマ"'+(W()?'':' disabled')+'>'+opts+'</select>'+
    '<button class="kadd" data-act="kadd" data-sid="'+s.id+'" data-id="'+c.id+'"'+(W()?'':' disabled')+'>＋ 追加</button><small>'+done+'/'+k+(done>=k&&k?' 修了':'')+'</small>'+komaTests(s,c,r,D,done,k)+'</span>'}
function komaTests(s,c,r,D,done,k){const dis=W()?'':' disabled',ct=r.ctest?.[c.id]||{},out=[];
  if(hasMid(c)&&done>=PART_SIZE&&!midPassed(s,c,null,D))out.push('<label class="final"><input type="checkbox" data-act="ctest" data-kind="mid" data-sid="'+s.id+'" data-id="'+c.id+'"'+(ct.mid?' checked':'')+dis+'> 中間テスト 合格</label>');
  if(k&&done>=k){if(!finPassed(s,c,null,D))out.push('<label class="final"><input type="checkbox" data-act="ctest" data-kind="fin" data-sid="'+s.id+'" data-id="'+c.id+'"'+(ct.fin?' checked':'')+dis+'> 修了判定テスト 合格</label>');
    else out.push('<span class="badge">修了判定 合格</span>')}
  return out.join('')}
function hmCleared(s,u,end){let t=Number(s.hmBase?.[u.id]?.cleared)||0;for(const d in S.days){if(end&&d>end)continue;t+=Number(S.days[d].rows?.[s.id]?.hm?.[u.id])||0}return t}
function hmPassed(s,u,end,exceptDate){if(s.hmBase?.[u.id]?.passed)return true;for(const d in S.days){if(end&&d>end)continue;if(d===exceptDate)continue;if(S.days[d].rows?.[s.id]?.final?.[u.id])return true}return false}
function rate(s,end){let tot=0,done=0;for(const c of s.courses||[]){const k=Number(c.koma)||0;tot+=k;done+=Math.min(courseDone(s,c,end),k)}return tot?{done,tot,r:done/tot}:null}
// 今日の日付の列に付ける印
function TD(d){return d===today()?' class="today"':''}
function prow(date,sid){return S.pdays[date]?.rows?.[sid]||null}
// 生徒が受講している高マスの単元（チェック項目がない古いデータは全単元を受講扱い）
function sUnits(s){return UNITS.filter(u=>!s.hmUnits||s.hmUnits[u.id])}
function planTot(sid,a,b){let lec=0,ex=0,att=0,set=false;for(const d of rangeDays(a,b)){const p=prow(d,sid);if(!p)continue;set=true;lec+=sumObj(p.courses);ex+=sumObj(p.hm);if(p.attend)att++}return {lec,ex,att,set}}

// ===== 保存 =====
const W=()=>!!S.db&&S.canWrite!==false;
const pending=new Map(), chains=new Map();
let saveState='idle';
function setSave(st,msg){saveState=st;const el=document.getElementById('save');el.className='save '+({saved:'ok',saving:'busy',error:'err'}[st]||'');
  el.querySelector('span').textContent=msg||({saved:'保存済み',saving:'保存中…',error:'保存できませんでした',idle:'接続済み',off:'保存先に未接続',ro:'閲覧のみ'}[st]||'')}
function overlay(coll){for(const [,p] of pending){if(p.coll!==coll)continue;const doc=S[coll][p.docId]=clone(S[coll][p.docId]||p.extra);doc.rows=doc.rows||{};doc.rows[p.sid]=p.row}}
function queueRow(coll,docId,sid,rowData,extra){
  if(!W())return;
  const doc=S[coll][docId]=clone(S[coll][docId]||extra);doc.rows=doc.rows||{};doc.rows[sid]=rowData;
  const k=coll+'|'+docId+'|'+sid;const old=pending.get(k);if(old)clearTimeout(old.timer);
  const p={coll,docId,sid,row:rowData,extra};p.timer=setTimeout(()=>flush(k),600);pending.set(k,p);
  setSave('saving');render();
}
function flush(k){
  const p=pending.get(k);if(!p)return;pending.delete(k);
  const key=p.coll+'/'+p.docId;
  const next=(chains.get(key)||Promise.resolve()).then(async()=>{
    const ref=S.db.doc(key);const snap=await ref.get();
    if(snap.exists)await ref.update({rows:{[p.sid]:p.row}});
    else await ref.set({...p.extra,rows:{[p.sid]:p.row}});
  }).then(()=>{if(!pending.size)setSave('saved')},e=>{handleWriteErr(e)});
  chains.set(key,next.catch(()=>{}));
}
function handleWriteErr(e){
  if(e&&e.code==='invalid_argument'&&S.canWrite===null){S.canWrite=false;setSave('ro');render();return}
  setSave('error',e?.code==='quota_exceeded'?'保存容量の上限です':'保存できませんでした');
}
async function writeDoc(path,data,merge){
  if(!W())return false;setSave('saving');
  try{const ref=S.db.doc(path);if(merge){const s=await ref.get();if(s.exists)await ref.update(data);else await ref.set(data)}else await ref.set(data);
    if(!pending.size)setSave('saved');return true}catch(e){handleWriteErr(e);return false}
}

// --- 週の予定（1日ごとに保存するので、開始日を変えても予定は消えない） ---
// --- 写真から読み込む（予定表の紙を読み取って週の予定に入れる） ---
const ROMAN='ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ';
function normName(x){return String(x||'').replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/g,c=>String(ROMAN.indexOf(c)+1)).normalize('NFKC').toLowerCase().replace(/iii/g,'3').replace(/ii/g,'2').replace(/[\s・\-_]|組|講|コマ|第/g,'')}
// 1〜10講が part1、11〜20講が part2（「part2 2」＝第12講）
const PART_SIZE=10;
function splitRaw(raw){
  const t=String(raw||'').normalize('NFKC');
  const pm=t.match(/^(.*?)(?:part|パート|ぱーと|p)\s*\.?\s*([1-9])\s*(?:[-ー−_の\s]\s*)*(\d+)\s*(?:講|コマ|こま)?\s*$/i);
  if(pm)return {prefix:pm[1],koma:(Number(pm[2])-1)*PART_SIZE+Number(pm[3]),part:true};
  const m=String(raw||'').match(/^(.*?)(\d+)\s*(?:講|コマ)?\s*$/);return m?{prefix:m[1],koma:Number(m[2])}:{prefix:String(raw||''),koma:0}}
// 講座がどの科目か。ここに載っていない講座は、名前に「英」→英語、「数」→数学
const SUBJECTS={'英語':['C組','D組','E組','武藤のレベルアップ']};
const SUBJ_ABBR={'英語':['英','英語'],'数学':['数','数学']};
function subjectOf(name){const n=normName(name);for(const k in SUBJECTS)if(SUBJECTS[k].some(x=>normName(x)===n))return k;
  const t=String(name||'');if(t.includes('英'))return '英語';if(t.includes('数'))return '数学';return ''}
// 修得済み（自分でチェック、または全コマ受講済み）の講座は、略記の候補から外す
function courseFinished(s,c){return !!c.finished||finPassed(s,c)||courseDone(s,c)>=(Number(c.koma)||20)}
// --- 受講のテスト（中間テスト：10講と11講の間、修了判定テスト：最後の講のあと） ---
function hasMid(c){return (Number(c.koma)||0)>PART_SIZE}
// これまでに受けた一番大きい講の番号（開始前の受講済みも含む）
function maxKoma(s,c,end){let m=Number(c.baseDone)||0;for(const d in S.days){if(end&&d>end)continue;for(const k of S.days[d].rows?.[s.id]?.komas?.[c.id]||[])if(k>m)m=k}return m}
function ctestDone(s,c,kind,end,exceptDate){
  if(kind==='mid'&&c.midDone)return true;if(kind==='fin'&&c.finDone)return true;
  for(const d in S.days){if(end&&d>end)continue;if(d===exceptDate)continue;if(S.days[d].rows?.[s.id]?.ctest?.[c.id]?.[kind])return true}return false}
// 11講目を始めていれば、中間テストは終わっていると考える
function midPassed(s,c,end,exceptDate){return !hasMid(c)||ctestDone(s,c,'mid',end,exceptDate)||maxKoma(s,c,end)>PART_SIZE}
function finPassed(s,c,end,exceptDate){return ctestDone(s,c,'fin',end,exceptDate)}
// 残りの受講コマ数（修得済み・全講終了の講座は除く。分析と同じ数え方）
function remainKoma(s){let t=0;for(const c of s.courses||[]){if(courseFinished(s,c))continue;t+=Math.max(0,(Number(c.koma)||0)-courseDone(s,c))}return t}
function courseTestBadges(s,c){const k=Number(c.koma)||0,d=Math.min(courseDone(s,c),k),out=[];
  if(hasMid(c)){if(midPassed(s,c))out.push('<span class="badge">中間✓</span>');else if(d>=PART_SIZE)out.push('<span class="badge warn">中間テスト待ち</span>')}
  if(finPassed(s,c))out.push('<span class="badge">修了判定 合格</span>');else if(k&&d>=k)out.push('<span class="badge warn">修了判定待ち</span>');
  return out.join(' ')}

// --- 学校の予定（定期テスト・行事） ---
const EV_TYPES={test:'定期テスト',fest:'文化祭',sports:'体育祭',trip:'修学旅行',other:'その他の行事'};
function schoolOf(s){return String(s.school||'').trim()}
function schoolId(name){return String(name).replace(/[\/\s]/g,'_').slice(0,200)||'_'}
function schoolEvents(name){return (S.schools[schoolId(name)]?.events)||[]}
function dayDiff(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5)}
function evRange(e){const en=e.end&&e.end>=e.start?e.end:e.start;return md(e.start)+(en!==e.start?'〜'+md(en):'')}
// その日の、学校のテスト・行事の状況（テスト当日／1週間前／2週間前）
function schoolStatus(s,D){
  const ev=schoolEvents(schoolOf(s)),out=[];
  for(const e of ev){if(!e.start)continue;const en=e.end&&e.end>=e.start?e.end:e.start;
    if(D>=e.start&&D<=en)out.push(e.type==='test'?{cls:'bad',txt:'テスト当日：'+(e.name||'定期テスト')}:{cls:'ev',txt:(e.name||EV_TYPES[e.type]||'行事')})}
  if(!out.some(x=>x.cls==='bad')){
    const up=ev.filter(e=>e.type==='test'&&e.start>D).sort((a,b)=>a.start<b.start?-1:1)[0];
    if(up){const n=dayDiff(D,up.start);
      if(n<=7)out.push({cls:'warn',txt:'テスト1週間前（あと'+n+'日・'+(up.name||'定期テスト')+' '+evRange(up)+'）'});
      else if(n<=14)out.push({cls:'note',txt:'テスト2週間前（あと'+n+'日・'+(up.name||'定期テスト')+' '+evRange(up)+'）'})}}
  return out}
function schoolBadges(s,D){const st=schoolStatus(s,D);return st.length?'<div class="sbadges">'+st.map(x=>'<span class="sb '+x.cls+'">'+esc(x.txt)+'</span>').join('')+'</div>':''}

// 「C14」「数2 10」「英18」のような略記から、その生徒の講座を1つに決める（決められなければ null）
function matchCourse(s,raw){const pre=normName(splitRaw(raw).prefix);if(!pre)return null;
  const cs=s.courses||[],open=cs.filter(c=>!courseFinished(s,c));
  const pick=list=>list.length===1?list[0].id:null;
  // 1) 講座名そのもの（例：C → C組、数2 → 数Ⅱ）
  const byName=cs.filter(c=>{const n=normName(c.name);return n&&(n.startsWith(pre)||pre.startsWith(n))});
  if(byName.length===1)return byName[0].id;
  if(byName.length>1){const o=byName.filter(c=>!courseFinished(s,c));if(o.length===1)return o[0].id}
  // 2) 科目の略記（例：英 → 英語の講座のうち、修得していないもの）
  for(const k in SUBJ_ABBR)if(SUBJ_ABBR[k].some(a=>normName(a)===pre)){const r=pick(open.filter(c=>subjectOf(c.name)===k));if(r)return r}
  return pick(byName)}
const IMP_MAX=10;
function courseInfo(s){return (s.courses||[]).map(c=>({id:c.id,name:c.name,subject:subjectOf(c.name)||'不明',finished:courseFinished(s,c),koma:Number(c.koma)||20}))}
// s を渡すとその生徒用。null なら名簿から氏名で生徒を決めてもらう
function impPrompt(s){
  const year=today().slice(0,4);
  const roster=s?null:allStudents().filter(x=>!x.archived).map(x=>({sid:x.id,name:x.name,grade:x.grade,courses:courseInfo(x),hm:sUnits(x).map(u=>u.id)}));
  return 'あなたは手書きの予定表を読み取る係です。画像は塾の生徒が書いた「予定表」の写真です。1枚目は紙全体、2枚目以降は同じ写真を半分に切った拡大用です（ない場合もあります）。紙は横向きや逆さまに写っていることがあります。\n\n'+
  '紙の構成：上に「氏名」欄と目標欄（目標欄は読まなくてよい）。表が2つあり、それぞれ7日分（合計14日）。各表の行は上から\n'+
  '・日付（例「10/16(金)」。月が省略されて「19(月)」のように書かれることがある）\n・登校有無（「有・無」のどちらかに丸）\n・登校時間（例「17:00」）\n・受講（最大4行。例「C14」＝講座Cの第14講、「数2 10」＝数Ⅱの第10講、「英18」＝英語の講座の第18講）\n・高マス（例「単語3」＝単語を3ステージ）\n・確認欄（読まない）\n\n'+

  (s?'この生徒が登録している講座：'+JSON.stringify(courseInfo(s))+'\nこの生徒が受講している高マスの単元：'+JSON.stringify(sUnits(s).map(u=>({id:u.id,name:u.name})))+'（空なら高マスは出力しない）\n'
    :'生徒名簿（sid・氏名・学年・講座・受講している高マスの単元id）：'+JSON.stringify(roster)+'\n氏名欄の手書きの名前から、名簿の生徒を1人選んで sid に入れる。名字だけ・崩し字・似た字でも、名簿の中で最も当てはまる生徒を選ぶ。決められなければ sid は null。受講と高マスは、その生徒の講座・単元から選ぶ。高マスの単元id：tango=単語、jukugo=熟語、bunpo=文法。\n')+

// 読み取った氏名から生徒を決める（1人に決まらなければ ''）
function matchStudent(name){const n=normName(name);if(!n)return '';const ss=allStudents().filter(x=>!x.archived);
  const eq=ss.filter(x=>normName(x.name)===n);if(eq.length===1)return eq[0].id;
  const part=ss.filter(x=>{const m=normName(x.name);return m&&(m.includes(n)||n.includes(m))});return part.length===1?part[0].id:''}
function normImport(raw,s){
  const units=sUnits(s),seen=new Set(),days=[];
  // 列は1日ずつ続くので、日（何日）は合っているのに月だけ違う日付は、前の列の次の日に直す
  // （「10/19」の後の「/20」が「1/20」に読めてしまう場合など。10/31→11/1 のように本当に月が変わる場合はそのまま）
  const rawDays=(raw&&Array.isArray(raw.days)?raw.days:[]).map(d=>({...(d||{})}));
  let prevD=null;
  for(const d of rawDays){
    const m=String(d.date||'').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)continue;
    let date=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    if(prevD){const exp=addDays(prevD,1);if(date!==exp&&date.slice(8)===exp.slice(8))date=exp}
    d.date=date;prevD=date;
  }
  for(const d of rawDays){
    const m=String(d&&d.date||'').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)continue;
    const date=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);if(seen.has(date))continue;seen.add(date);
    const unsure=Array.isArray(d.unsure)?d.unsure.map(String):[];
    const dw=String(d.dow||'').replace(/[()（）曜日\s]/g,'').slice(0,1);if(dw&&DOW[dow(date)]!==dw)unsure.push('date');
    let attend=d.attend;if(attend!==true&&attend!==false){attend=false;unsure.push('attend')}
    const tm=String(d.time||'').trim().match(/^(\d{1,2})[:：](\d{2})$/);const time=tm?pad(tm[1])+':'+tm[2]:'';
    const lectures=(Array.isArray(d.lectures)?d.lectures:[]).map(l=>{const rawTxt=String(l&&l.raw||'');
      const course=(s.courses||[]).some(c=>c.id===l.course)?l.course:matchCourse(s,rawTxt);
      const sp=splitRaw(rawTxt);
      const koma=Math.max(0,Math.round(sp.part?sp.koma:(Number(l.koma)||sp.koma||0)));
      if(!course)unsure.push('lectures');return {raw:rawTxt,course:course||'',koma}});
    const hm={};for(const h of (Array.isArray(d.hm)?d.hm:[])){const u=units.find(x=>x.id===h.unit)||units.find(x=>String(h.raw||'').includes(x.name));
      if(u)hm[u.id]=(hm[u.id]||0)+Math.max(0,Math.round(Number(h.stages)||0));else unsure.push('hm')}
    days.push({date,attend,time,lectures,hm,unsure:[...new Set(unsure)],skip:false});
  }
  days.sort((a,b)=>a.date<b.date?-1:1);
  return {name:String(raw&&raw.name||'').trim(),days};
}
// 写真を JPEG に描き直し、拡大用に紙の半分ずつも切り出す
async function prepImages(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const W=img.naturalWidth,H=img.naturalHeight;
    const cut=(x,y,w,h)=>{const sc=Math.min(1,1600/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext('2d').drawImage(img,x,y,w,h,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.9))};
    const out=[await cut(0,0,W,H)];
    if((S.imgLimit?.maxCount||1)>=3){const ov=0.04;
      if(H>=W){const w=W*(0.5+ov);out.push(await cut(0,0,w,H),await cut(W-w,0,w,H))}
      else{const h=H*(0.5+ov);out.push(await cut(0,0,W,h),await cut(0,H-h,W,h))}}
    return out.filter(Boolean);
  }finally{URL.revokeObjectURL(url)}
}
function impErr(e){return ({not_granted:'ログインの確認ができませんでした。アプリを開き直してから、もう一度読み取ってください。',sampling_disabled:'写真の読み取りの設定（APIキー）がまだ終わっていません。管理者に伝えてください。',
  rate_limited:'混み合っているか、今月の利用上限に達しています。少し時間をおいてから読み取ってください。続く場合は管理者に伝えてください。',image_rejected:'この写真は読み込めませんでした。JPEGかPNGの写真を選び直してください。',
  images_unavailable:'この画面では写真を送れません。claude.ai 上でこのページを開いてください。',invalid_json:'読み取りがうまくいきませんでした。もう一度「読み取る」を押してください。',
  refused:'この写真は読み取れませんでした。予定表の紙だけが写った写真を選んでください。',cancelled:''}[e&&e.code])??'読み取りに失敗しました。通信状況を確認して、もう一度「読み取る」を押してください。'}
// 写真を追加（アルバム・ファイル・ドラッグ＆ドロップ・貼り付けの共通）
function impAddFiles(list){
  const I=S.imp;if(!I||I.step!=='pick')return;
  const fs=[...(list||[])].filter(f=>f&&(/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name||'')));
  if(!fs.length){I.err='写真のファイルを選んでください（JPEG・PNG・HEIC など）。';render();return}
  const room=Math.max(0,IMP_MAX-I.files.length);
  fs.slice(0,room).forEach(f=>I.files.push({file:f,url:URL.createObjectURL(f)}));
  I.err=fs.length>room?'写真は'+IMP_MAX+'枚までです。最初の'+room+'枚だけ追加しました。':'';render();
}

// 1枚分を読み取る
async function readSheet(I,sh){
  sh.status='reading';render();
  try{
    const fixed=I.sid?S.students[I.sid]:null;
    const imgs=await prepImages(sh.file);
    const raw=await S.sample.json(impPrompt(fixed),{images:imgs,signal:I.ctl.signal,cache:false});
    if(S.imp!==I)return;
    sh.raw=raw;sh.name=String(raw&&raw.name||'').trim();
    let sid=fixed?fixed.id:'';
    if(!sid){const c=raw&&raw.sid;sid=(c&&S.students[c]&&!S.students[c].archived)?c:matchStudent(sh.name);sh.auto=!!sid}
    setSheetStudent(sh,sid);
    sh.status=sh.data&&!sh.data.days.length?'error':'done';if(sh.status==='error')sh.err='日付が読み取れませんでした。紙全体が写った、明るい写真か確認してください。';
  }catch(e){if(S.imp!==I)return;sh.status='error';sh.err=impErr(e)||'中止しました。'}
  render();
}
function setSheetStudent(sh,sid){sh.sid=sid||'';const st=S.students[sh.sid];sh.data=st&&sh.raw?normImport(sh.raw,st):(sh.raw?{name:sh.name,days:[]}:null)}
async function runPaste(){
  const I=S.imp;if(!I)return;let obj;
  try{obj=JSON.parse(String(I.paste||'').trim())}catch(e){I.err='貼り付けた文字を読み込めませんでした。Claude版でコピーした文字を、そのまま全部貼り付けてください。';render();return}
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.sheets)?obj.sheets:[]);
  if(!list.length){I.err='読み取り結果が入っていません。Claude版で読み取ってから「新しいアプリ用にコピー」を押してください。';render();return}
  I.sheets=list.map(x=>{const raw=x&&x.raw?x.raw:x;
    const sh={file:null,url:'',status:'done',err:'',sid:'',raw,name:String(x&&x.name||raw&&raw.name||'').trim(),skip:false,auto:false};
    const ok=id=>id&&S.students[id]&&!S.students[id].archived;
    const sid=ok(x&&x.sid)?x.sid:ok(raw&&raw.sid)?raw.sid:matchStudent(sh.name);
    sh.auto=!!sid;setSheetStudent(sh,sid);
    if(sh.data&&!sh.data.days.length){sh.status='error';sh.err='日付が読み取れていません。'}
    return sh});
  I.step='review';I.err='';render();
}
async function runImport(){
  const I=S.imp;if(!I||!I.files.length||!S.sample)return;
  if(I.sid&&I.files.length>1){I.err='生徒を1人に決めたときは、写真は1枚だけ選んでください。複数枚のときは「写真の氏名から自動で決める」を選んでください。';render();return}
  I.step='reading';I.err='';I.ctl=new AbortController();
  I.sheets=I.files.map(f=>({file:f.file,url:f.url,status:'wait',err:'',sid:'',raw:null,data:null,name:'',skip:false,auto:false}));render();
  // 2枚ずつ同時に読む
  let next=0;const worker=async()=>{while(next<I.sheets.length&&S.imp===I&&!I.ctl.signal.aborted){const sh=I.sheets[next++];await readSheet(I,sh)}};
  await Promise.all([worker(),worker()]);
  if(S.imp!==I)return;
  I.sheets.forEach(sh=>{if(sh.status==='wait'){sh.status='error';sh.err='中止しました。'}});
  I.step='review';render();
}

function impEdit(t){
  const I=S.imp;if(!I||!I.sheets)return;const sh=I.sheets[Number(t.dataset.si)];if(!sh)return;

  if(f==='ssid'){sh.auto=false;setSheetStudent(sh,t.value);if(sh.data&&sh.data.days.length&&sh.status==='error'){sh.status='done';sh.err=''}render();return}
  if(f==='sskip'){sh.skip=t.checked;render();return}
  const d=sh.data&&sh.data.days[Number(t.dataset.di)];if(!d)return;
  const l=d.lectures[Number(t.dataset.li)];
  const clear=k=>{d.unsure=d.unsure.filter(x=>x!==k)};
  if(f==='use'){d.skip=!t.checked;render()}
  else if(f==='date'){if(t.value){d.date=t.value;clear('date');render()}}
  else if(f==='attend'){d.attend=t.checked;clear('attend');render()}
  else if(f==='time'){d.time=t.value;clear('time')}

  else if(f==='lkoma'&&l){l.koma=Math.max(0,Math.round(Number(t.value)||0));render()}

}

// 1人分（1枚分）を保存
async function saveSheet(sh){
  const s=S.students[sh.sid],use=sh.data.days.filter(d=>!d.skip);
  for(const d of use){
    const old=prow(d.date,s.id)||{};
    // 上書き：前に入っていた講座・単元は 0 にしてから、紙の内容を入れる
    const r={attend:!!d.attend,time:d.attend?(d.time||''):'',courses:{},komas:{},hm:{}};
    for(const k in old.courses||{})r.courses[k]=0;for(const k in old.komas||{})r.komas[k]=[];for(const k in old.hm||{})r.hm[k]=0;
    for(const l of d.lectures){r.courses[l.course]=(r.courses[l.course]||0)+1;if(l.koma)(r.komas[l.course]=r.komas[l.course]||[]).push(l.koma)}
    for(const k in d.hm)r.hm[k]=d.hm[k]||0;
    const cur=clone(S.pdays[d.date]||{date:d.date,rows:{}});cur.rows=cur.rows||{};cur.rows[s.id]=r;S.pdays[d.date]=cur;
    if(!await writeDoc('pdays/'+d.date,{date:d.date,rows:{[s.id]:r}},true))return d.date;
  }
  return null;
}
async function saveImport(){
  const I=S.imp;if(!I||!I.sheets)return;
  const list=I.sheets.filter(x=>!x.skip&&x.sid&&x.data&&x.data.days.some(d=>!d.skip));
  for(const sh of list){
    const st=S.students[sh.sid],use=sh.data.days.filter(d=>!d.skip),dates=use.map(d=>d.date);
    if(new Set(dates).size!==dates.length){I.err=st.name+'さんの写真に、同じ日付が2回あります。日付を確認してください。';render();return}
    if(use.some(d=>d.lectures.some(l=>!l.course))){I.err=st.name+'さんの写真に、講座が決まっていない受講があります（黄色の欄）。講座を選ぶか「×」で消してください。';render();return}
  }
  I.err='';I.saving=true;
  const saved=[];let first=null;
  for(const sh of list){
    const bad=await saveSheet(sh);
    if(bad){I.err=(saved.length?saved.join('・')+'さんの分は保存しました。':'')+S.students[sh.sid].name+'さんの'+fmtDay(bad)+'から保存できませんでした。通信状況を確認して、もう一度「保存」を押してください。';I.saving=false;render();return}
    saved.push(S.students[sh.sid].name);sh.skip=true;
    const f=sh.data.days.filter(d=>!d.skip).map(d=>d.date).sort()[0];if(f&&(!first||f<first))first=f;
  }
  I.sheets.forEach(x=>x.url&&URL.revokeObjectURL(x.url));
  S.imp=null;S.backY=null;if(first)S.planStart=first;S.impMsg=saved.join('・')+'さん（'+saved.length+'人）の予定を保存しました。';
  render();
}

function niceMax(v){if(v<=4)return 4;const e=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*e>=v)return m*e;return 10*e}
function barChart(items,unit){
  const max=Math.max(0,...items.map(i=>i.v));const top=niceMax(max||1);
  const ticks=[0,top/2,top];
  const iMax=max>0?items.findIndex(i=>i.v===max):-1;const iLast=items.length-1;
  let h='<div class="chart"><div class="yax">'+ticks.map(t=>'<span style="bottom:'+(t/top*100)+'%">'+(Number.isInteger(t)?t:t.toFixed(1))+'</span>').join('')+'</div><div class="plot">'+
    ticks.slice(1).map(t=>'<div class="grid" style="bottom:'+(t/top*100)+'%"></div>').join('');
  items.forEach((it,i)=>{const hp=(it.v/top*100);
    h+='<div class="col'+(it.today?' today':'')+'" tabindex="0" data-tip="'+esc(it.tip)+'" style="--h:'+hp+'%"><div class="b" style="height:'+hp+'%"></div>'+((i===iMax||i===iLast)&&it.v>0?'<span class="lab">'+it.v+'</span>':'')+'</div>'});
  h+='</div></div><div class="xax">'+items.map(i=>'<span'+(i.today?' class="istoday"':'')+'>'+esc(i.x)+'</span>').join('')+'</div>';

}

  const avgC=T('lec')/n,avgP=P('lec')/n;

    '<div class="tile"><span class="k">平均受講数（1人あたり）</span><span class="v">'+avgC.toFixed(1)+'<small>コマ</small></span><span class="sub">前週 <span class="num">'+avgP.toFixed(1)+'</span> '+delta(avgC,avgP,{dig:1})+'</span><span class="sub">対象 '+n+' 名</span></div></div>';
  const days=rangeDays(ws,we);
  h+='<div class="panel"><h3>日別の受講数（コマ）</h3>'+barChart(days.map(d=>{let l=0,a=0,e=0;for(const s of list){const r=row(d,s.id);if(!r)continue;l+=sumObj(r.courses);e+=sumObj(r.hm);if(r.attend)a++}
    return {x:fmtDay(d),today:d===today(),v:l,tip:fmtDay(d)+'\n受講 '+l+' コマ\n演習 '+e+' ステージ\n登校 '+a+' 名'}}))+'</div>';
  h+=summaryTable(rows,'前週',true,null,'今週');

}
// 「前 → 今」の比較セル（真ん中に増減、今の数字は太字）
function cmp(prev,cur,o={}){const f=o.fmt||(v=>String(v));let d;
  if(prev==null||cur==null)d='<span class="d flat">&nbsp;</span>';
  else{let x=cur-prev;if(Math.abs(x)<1e-9)x=0;const v=Math.abs(x).toFixed(o.dig||0)+(o.unit||'');d=x>0?'<span class="d up">+'+v+'</span>':x<0?'<span class="d down">−'+v+'</span>':'<span class="d flat">±0</span>'}
  return '<div class="cmp"><span class="pv">'+(prev==null?'—':f(prev))+'</span><span class="mid">'+d+'<span class="arr">→</span></span><b class="cv">'+(cur==null?'—':f(cur))+'</b>'+(o.plan!=null?'<span class="plan">予定 '+o.plan+'</span>':'')+'</div>'}
function summaryTable(rows,prevLabel,withPlan,extra,curLabel){
  const pl=(r,k)=>withPlan&&r.pl.set?r.pl[k]:null;
  const th=t=>'<th>'+t+'<br><span class="hsub">'+prevLabel+' → '+curLabel+'</span></th>';
  let h='<div class="tablewrap"><table class="sum"><thead><tr><th class="l">生徒</th>'+th('受講')+th('演習')+th('登校')+(extra?extra.head:'')+'<th class="l">状況</th></tr></thead><tbody>';
  for(const r of rows){
    const low=withPlan&&r.pl.set&&((r.pl.lec&&r.c.lec<r.pl.lec*0.5)||(r.pl.att&&r.c.att<r.pl.att*0.5));
    const zero=r.c.lec+r.c.ex+r.c.att===0;
    const drop=(r.c.lec<r.p.lec)&&(r.c.att<r.p.att);
    const flag=zero||low||drop;
    const tag=zero?'<span class="badge bad">記録なし</span>':low?'<span class="badge bad">予定の半分未満</span>':drop?'<span class="badge warn">前より減少</span>':'';
    h+='<tr class="'+(flag?'flag':'')+'"><td class="l">'+sname(r.s)+' <span class="of">'+esc(r.s.grade)+'</span></td>'+
      '<td>'+cmp(r.p.lec,r.c.lec,{plan:pl(r,'lec')})+'</td><td>'+cmp(r.p.ex,r.c.ex,{plan:pl(r,'ex')})+'</td><td>'+cmp(r.p.att,r.c.att,{plan:pl(r,'att')})+'</td>'+
      (extra?extra.cell(r):'')+'<td class="l">'+tag+'</td></tr>';
  }
  const hp=rows.every(r=>r.p.lec!=null);
  const sum=(k,w)=>(w==='p'&&!hp)?null:rows.reduce((a,r)=>a+r[w][k],0);
  const psum=k=>withPlan&&rows.some(r=>r.pl.set)?rows.reduce((a,r)=>a+(r.pl.set?r.pl[k]:0),0):null;
  h+='</tbody><tfoot><tr><td class="l">合計</td><td>'+cmp(sum('lec','p'),sum('lec','c'),{plan:psum('lec')})+'</td><td>'+cmp(sum('ex','p'),sum('ex','c'),{plan:psum('ex')})+'</td><td>'+cmp(sum('att','p'),sum('att','c'),{plan:psum('att')})+'</td>'+(extra?extra.foot:'')+'<td></td></tr></tfoot></table></div>'+
    '<p class="note">各欄は「'+prevLabel+' → '+curLabel+'」で、真ん中の数字が増減です。'+(withPlan?'下の小さな「予定」はその週の予定です。':'')+'左端に赤い線がある行は、記録がない・予定の半分未満・受講と登校がどちらも前より減った生徒です。</p>';
  return h;
}

// --- 月次サマリー ---
// 日付をnか月ずらす（月末を超える日は月末にそろえる。例：3/31の1か月前→2/28）
function shiftDate(dt,n){const [y,m,d]=dt.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(Math.min(d,last))}
function vMonth(){
  const PS=periodState(),{a,b,pa,pb,hasPrev,ym,months,minD}=PS,cumA=minD;
  const list=visible();
  let h='<h2>月次サマリー</h2><p class="lead">期間を選ぶと、前の月の同じ日付の期間と比べます（例：10/1〜10/12 を選ぶと 9/1〜9/12 と比較）。2026年9月からの記録が対象です。</p>'+periodBar(PS);
  if(!list.length)return h+emptyStudents();
  const rows=list.map(s=>{const c=stats(s.id,a,b),p=hasPrev?stats(s.id,pa,pb):{lec:null,ex:null,att:null},cum=stats(s.id,cumA,b),rt=rate(s,b),prt=hasPrev?rate(s,pb):null;return {s,c,p,cum,rt,prt,pl:{set:false}}});
  const T=k=>rows.reduce((x,r)=>x+r.c[k],0),P=k=>hasPrev?rows.reduce((x,r)=>x+r.p[k],0):null,C=k=>rows.reduce((x,r)=>x+r.cum[k],0);
  const n=list.length;
  const agg=key=>{let d=0,t=0;for(const r of rows){const q=r[key];if(q){d+=q.done;t+=q.tot}}return t?{done:d,tot:t,r:d/t}:null};
  const R=agg('rt'),PR=hasPrev?agg('prt'):null;
  const tile=(k,label,unit)=>{const c=T(k),p=P(k);return '<div class="tile"><span class="k">'+label+'</span><span class="v">'+c+'<small>'+unit+'</small></span><span class="sub">前月同期間 <span class="num">'+(p??'—')+'</span> '+delta(c,p)+'</span><span class="sub">2026年9月からの累計 <span class="num">'+C(k)+'</span> '+unit+'</span></div>'};
  const avgC=T('lec')/n,avgP=hasPrev?P('lec')/n:null;
  h+='<div class="tiles">'+tile('lec','総受講数','コマ')+tile('ex','総演習数','ステージ')+tile('att','総登校数','回')+
    '<div class="tile"><span class="k">平均受講数（1人あたり）</span><span class="v">'+avgC.toFixed(1)+'<small>コマ</small></span><span class="sub">前月同期間 <span class="num">'+(avgP==null?'—':avgP.toFixed(1))+'</span> '+delta(avgC,avgP,{dig:1})+'</span><span class="sub">対象 '+n+' 名</span></div>'+
    '<div class="tile"><span class="k">受講修了率</span><span class="v">'+(R?(R.r*100).toFixed(1):'—')+'<small>%</small></span><span class="sub">'+(hasPrev?md(pb):'比較')+'時点 <span class="num">'+(PR?pct(PR.r):'—')+'</span> '+(R&&PR?delta(R.r*100,PR.r*100,{dig:1,unit:'pt',noRate:true}):'<span class="d flat">—</span>')+'</span><span class="sub">'+(R?'<span class="num">'+R.done+' / '+R.tot+'</span> コマ':'講座が未登録です')+'</span><div class="meter"><i style="width:'+(R?R.r*100:0)+'%"></i></div></div></div>';
  const ms=months.filter(m=>m<=ym);
  h+='<div class="panel"><h3>月別の総受講数（コマ）</h3>'+barChart(ms.map(m=>{const [x,y]=monthRange(m);let l=0,e=0,t=0;for(const s of list){const q=stats(s.id,x,y);l+=q.lec;e+=q.ex;t+=q.att}
    return {x:Number(m.slice(5))+'月',v:l,tip:monthLabel(m)+'\n受講 '+l+' コマ\n演習 '+e+' ステージ\n登校 '+t+' 回'}}))+'</div>';
  const rf=v=>v.toFixed(1)+'%';
  h+=summaryTable(rows,'前月同期間',false,{
    head:'<th>受講修了率<br><span class="hsub">'+(hasPrev?md(pb):'比較')+'時点 → '+md(b)+'時点</span></th><th>累計受講</th>',
    cell:r=>'<td>'+cmp(r.prt?r.prt.r*100:null,r.rt?r.rt.r*100:null,{fmt:rf,dig:1,unit:'pt'})+'</td><td class="num">'+r.cum.lec+'</td>',
    foot:'<td>'+cmp(PR?PR.r*100:null,R?R.r*100:null,{fmt:rf,dig:1,unit:'pt'})+'</td><td class="num">'+C('lec')+'</td>'},'今期間');
  h+='<p class="note">受講修了率 ＝ 期間の終わりの日までに受講したコマ数の合計 ÷ 取っている講座の総コマ数（アプリを使い始める前に受講済みのコマも含みます）。</p>';
  return h;
}

// 期間（月次サマリーとランキングで共通。前月同期間と比べる）
function periodState(){
  const months=monthList(),minD=FIRST_MONTH+'-01';
  if(!S.mStart||!S.mEnd){const cm=months[months.length-1];S.mStart=cm+'-01';S.mEnd=cm===curMonth()?today():monthRange(cm)[1]}
  if(S.mStart<minD)S.mStart=minD;if(S.mEnd<S.mStart)S.mEnd=S.mStart;
  const a=S.mStart,b=S.mEnd,pa=shiftDate(a,-1),pb=shiftDate(b,-1),hasPrev=pb>=minD,ym=b.slice(0,7);
  const fullMonth=a.slice(8)==='01'&&b===monthRange(ym)[1]&&a.slice(0,7)===ym;
  return {months,minD,a,b,pa,pb,hasPrev,ym,fullMonth};
}
function periodBar(P){const {months,minD,a,b,pa,pb,hasPrev,ym,fullMonth}=P;
  return '<div class="toolbar"><button class="btn" data-act="mon" data-d="-1" aria-label="1か月前の期間"'+(shiftDate(a,-1)>=minD?'':' disabled')+'>◀</button>'+
  '<input class="date" type="date" id="mStart" value="'+a+'" min="'+minD+'" aria-label="期間の始め"><span>〜</span><input class="date" type="date" id="mEnd" value="'+b+'" min="'+minD+'" aria-label="期間の終わり">'+
  '<button class="btn" data-act="mon" data-d="1" aria-label="1か月後の期間">▶</button>'+
  '<label class="inline" style="font-size:12px;color:var(--muted)">月まるごと <select class="date" id="mSel"><option value="">選ぶ</option>'+months.map(m=>'<option value="'+m+'"'+(fullMonth&&m===ym?' selected':'')+'>'+monthLabel(m)+'</option>').join('')+'</select></label></div>'+
  '<div class="toolbar" style="margin-top:-6px"><span class="range">期間：'+fmtDay(a)+' 〜 '+fmtDay(b)+'（'+rangeDays(a,b).length+'日間）　'+(hasPrev?'比較：'+fmtDay(pa)+' 〜 '+fmtDay(pb):'比較：2026年9月より前のため、なし')+'</span></div>';
}

// --- ランキング ---
// 生徒全員を段階（帯）に分けて並べる。帯は上ほど良い順。
const INF=Infinity;
const byRange=r=>v=>r.findIndex(([lo,hi])=>v>=lo&&v<=hi);
function mkSec(title,note,labels,list,cls,valf,fmt,exclLabel){
  const bands=labels.map(l=>({label:l,items:[]}));let ex=0;
  for(const s of list){const i=cls(s);if(i<0){ex++;continue}bands[i].items.push({s,v:valf(s)})}
  bands.forEach(b=>b.items.sort((x,y)=>y.v-x.v));
  return {title,note,bands,ex,exclLabel,fmt};
}
function rankSections(list,P){
  const {a,b,pa,pb,hasPrev}=P,C={},Pv={},PL={},R={};
  for(const s of list){C[s.id]=stats(s.id,a,b);Pv[s.id]=hasPrev?stats(s.id,pa,pb):null;PL[s.id]=planTot(s.id,a,b);R[s.id]=rate(s,b)}
  const n=v=>String(v);
  const lecR=[[31,INF],[21,30],[11,20],[1,10],[0,0]],exR=[[21,INF],[11,20],[6,10],[1,5],[0,0]],attR=[[15,INF],[10,14],[5,9],[1,4],[0,0]];
  const secs=[
    mkSec('受講数','期間内に受講したコマ数（同じコマの繰り返しも数える）',['31コマ以上','21〜30コマ','11〜20コマ','1〜10コマ','0コマ'],list,s=>byRange(lecR)(C[s.id].lec),s=>C[s.id].lec,v=>v+'コマ',''),
    mkSec('高マス演習数','期間内にクリアしたステージ数',['21ステージ以上','11〜20ステージ','6〜10ステージ','1〜5ステージ','0ステージ'],list,s=>sUnits(s).length?byRange(exR)(C[s.id].ex):-1,s=>C[s.id].ex,v=>v+'ステージ','高マスを受講していない'),
    mkSec('登校日数','期間内に登校した日数',['15日以上','10〜14日','5〜9日','1〜4日','0日'],list,s=>byRange(attR)(C[s.id].att),s=>C[s.id].att,v=>v+'日',''),
    mkSec('受講修了率',md(b)+' 時点。取っている講座の総コマ数のうち、受講が終わった割合',['100%（全講座修了）','75〜99%','50〜74%','25〜49%','0〜24%'],list,s=>R[s.id]?byRange([[100,INF],[75,99.999],[50,74.999],[25,49.999],[0,24.999]])(R[s.id].r*100):-1,s=>R[s.id]?R[s.id].r*100:0,v=>Math.floor(v)+'%','講座が未登録'),
    mkSec('受講の予定達成率','期間内の受講コマ数 ÷ 週の予定で立てた受講コマ数',['100%以上','80〜99%','50〜79%','50%未満'],list,s=>PL[s.id].lec>0?byRange([[100,INF],[80,99.999],[50,79.999],[0,49.999]])(C[s.id].lec/PL[s.id].lec*100):-1,s=>PL[s.id].lec>0?C[s.id].lec/PL[s.id].lec*100:0,v=>Math.round(v)+'%','受講の予定が入っていない'),
    mkSec('受講数の伸び',hasPrev?'前月同期間（'+md(pa)+'〜'+md(pb)+'）と比べた受講コマ数の増減':'比較する期間がありません（2026年9月より前）',['+5コマ以上','+1〜4コマ','変わらず','減った'],list,s=>hasPrev?byRange([[5,INF],[1,4],[0,0],[-INF,-1]])(C[s.id].lec-Pv[s.id].lec):-1,s=>hasPrev?C[s.id].lec-Pv[s.id].lec:0,v=>(v>0?'+':v<0?'−':'±')+Math.abs(v),'比較する期間がない'),
  ];
  for(const u of UNITS){
    secs.push(mkSec('高マス '+u.name+'の進み具合',md(b)+' 時点（全'+u.stages+'ステージ）',['修得（修了判定に合格）','修了判定待ち','進行中','未着手'],list,
      s=>{if(!sUnits(s).includes(u))return -1;const c=Math.min(hmCleared(s,u,b),u.stages);return hmPassed(s,u,b)?0:c>=u.stages?1:c>0?2:3},
      s=>Math.min(hmCleared(s,u,b),u.stages),v=>v+'/'+u.stages,u.name+'を受講していない'));
  }
  // 平均（受講・登校は1か月あたり、修了率は講座のある生徒の平均）
  const cnt=list.length||1,days=dayDiff(a,b)+1,full=P.fullMonth;
  const per=v=>full?v:v*30/days;
  const tl=list.reduce((x,s)=>x+C[s.id].lec,0),ta=list.reduce((x,s)=>x+C[s.id].att,0);
  const rs=list.filter(s=>R[s.id]).map(s=>R[s.id].r*100);
  const basis=full?'この月':days+'日間を30日あたりに換算';
  secs[0].avg={label:'月間平均受講コマ数',value:per(tl/cnt).toFixed(1)+'コマ',note:'1人あたり・'+basis};
  secs[2].avg={label:'月間平均登校日数',value:per(ta/cnt).toFixed(1)+'日',note:'1人あたり・'+basis};
  secs[2].avg2={label:'週の平均登校日数',value:(ta/cnt*7/days).toFixed(1)+'日',note:'1人あたり・'+days+'日間を7日あたりに換算'};
  secs[3].avg={label:'平均受講修了率',value:rs.length?(rs.reduce((x,v)=>x+v,0)/rs.length).toFixed(1)+'%':'—',note:md(b)+' 時点・講座のある'+rs.length+'名の平均'};
  return secs;
}
function secHTML(x){
  const tot=x.bands.reduce((a,b)=>a+b.items.length,0);

    [x.avg,x.avg2].filter(Boolean).map(a=>'<div class="ravg"><span>'+esc(a.label)+'</span><b>'+esc(a.value)+'</b><span class="of">'+esc(a.note)+'</span></div>').join('')+

      return '<div class="band'+(c?'':' zero')+(i===0&&c?' top':'')+'"><span class="bl">'+esc(b.label)+'</span><div class="bc"><span class="btrack"><span class="bbar" style="width:'+(tot?c/tot*100:0)+'%"></span></span><span class="bn">'+c+'人</span></div>'+
        (c?'<div class="names">'+b.items.map(it=>'<span class="nchip">'+sname(it.s)+'<span class="of">'+esc(x.fmt(it.v))+'</span></span>').join('')+'</div>':'')+'</div>'}).join('')+
    (x.ex?'<p class="rnote" style="margin:8px 0 0">対象外 '+x.ex+'名（'+esc(x.exclLabel)+'）</p>':'')+'</div>';

function secText(x){
  return '■'+x.title+'\n'+[x.avg,x.avg2].filter(Boolean).map(a=>'・'+a.label+'：'+a.value+'（'+a.note+'）\n').join('')+x.bands.map(b=>'・'+b.label+'：'+b.items.length+'人'+(b.items.length?'（'+b.items.map(it=>it.s.name+' '+x.fmt(it.v)).join('、')+'）':'')).join('\n')+(x.ex?'\n・対象外：'+x.ex+'名（'+x.exclLabel+'）':'');

function vRank(){
  const P=periodState(),list=visible();
  let h='<h2>ランキング</h2><p class="lead">選んだ期間の数字で、表示中の生徒全員を段階ごとに分けて並べます。各段階の中は数字の大きい順です。月のまとめや、声をかける生徒を探すのに使えます。</p>'+periodBar(P)+
    '<div class="toolbar" style="margin-top:-4px"><button class="btn" data-act="rcopy"'+(list.length?'':' disabled')+'>テキストでコピー</button><span class="rnote" id="rcopyMsg" style="margin:0"></span></div>'+
    '<textarea id="rcopyBox" class="copybox" rows="8" readonly hidden aria-label="コピー用のテキスト"></textarea>';
  if(!list.length)return h+emptyStudents();
  const secs=rankSections(list,P);
  S.rankText='【ランキング】'+fmtDay(P.a)+'〜'+fmtDay(P.b)+'（対象 '+list.length+'名）\n\n'+secs.map(secText).join('\n\n');
  return h+'<div class="rgrid">'+secs.map(secHTML).join('')+'</div>';
}

// --- 生徒 ---
function blankStudent(){const hb={};UNITS.forEach(u=>hb[u.id]={cleared:0,passed:false});return {name:'',grade:'高1',school:'',memo:'',archived:false,courses:[{id:uid('c'),name:'',koma:20,baseDone:0}],hmBase:hb,hmUnits:Object.fromEntries(UNITS.map(u=>[u.id,false]))}}
// --- 分析 ---
const ANA_RANGES=[['7','直近1週間'],['14','直近2週間'],['28','直近4週間'],['month','今月'],['all','記録の最初から']];
function anaRange(){
  const b=today(),r=S.anaRange||'28';
  let a=r==='month'?b.slice(0,7)+'-01':r==='all'?FIRST_MONTH+'-01':addDays(b,-(Number(r)-1));
  const n=dayDiff(a,b)+1;return {a,b,n,pa:addDays(a,-n),pb:addDays(a,-1)}}
function lastDate(sid,pred,end){let best='';for(const d in S.days){if(d>end)continue;const r=S.days[d].rows?.[sid];if(r&&pred(r)&&d>best)best=d}return best}
// 生徒ごとの数字と、気になる点・原因の候補
function anaStudent(s,R){
  const c=stats(s.id,R.a,R.b),p=stats(s.id,R.pa,R.pb),pl=planTot(s.id,R.a,R.b),rt=rate(s,R.b);
  const lastAtt=lastDate(s.id,r=>r.attend,R.b),lastLec=lastDate(s.id,r=>sumObj(r.courses)>0,R.b);
  const sinceAtt=lastAtt?dayDiff(lastAtt,R.b):null,sinceLec=lastLec?dayDiff(lastLec,R.b):null;
  const weeks=Math.max(1,R.n/7),pace=c.lec/weeks;
  let remain=0;for(const co of s.courses||[]){if(courseFinished(s,co))continue;remain+=Math.max(0,(Number(co.koma)||0)-courseDone(s,co))}
  const units=sUnits(s).filter(u=>!hmPassed(s,u));
  const pend=[];for(const co of s.courses||[]){const k=Number(co.koma)||0,d=Math.min(courseDone(s,co),k);
    if(hasMid(co)&&d>=PART_SIZE&&!midPassed(s,co))pend.push(co.name+' 中間テスト');
    if(k&&d>=k&&!finPassed(s,co))pend.push(co.name+' 修了判定テスト')}
  for(const u of sUnits(s)){if(!hmPassed(s,u)&&hmCleared(s,u)>=u.stages)pend.push('高マス'+u.name+' 修了判定')}
  const alerts=[];
  if(sinceAtt==null)alerts.push({k:'att',txt:'登校の記録がない'});else if(sinceAtt>=7)alerts.push({k:'att',txt:sinceAtt+'日間登校なし（最後 '+md(lastAtt)+'）',from:addDays(lastAtt,1)});
  if(remain>0){if(sinceLec==null)alerts.push({k:'lec',txt:'受講の記録がない'});else if(sinceLec>=7)alerts.push({k:'lec',txt:sinceLec+'日間受講なし（最後 '+md(lastLec)+'）',from:addDays(lastLec,1)})}
  if(pl.lec>0&&c.lec<pl.lec*0.5)alerts.push({k:'plan',txt:'受講が予定の半分未満（'+c.lec+'/'+pl.lec+'コマ）',from:R.a});
  if(units.length&&c.ex===0)alerts.push({k:'hm',txt:'高マスが止まっている（'+units.map(u=>u.name).join('・')+'）',from:R.a});
  if(p.lec>=3&&c.lec<=p.lec/2)alerts.push({k:'drop',txt:'受講が前の期間の半分以下（'+p.lec+'→'+c.lec+'コマ）',from:R.a});
  // 原因の候補：学校の予定（テスト・行事）と重なっているか
  const ev=schoolEvents(schoolOf(s)),causes=[];
  const from=alerts.filter(x=>x.from).map(x=>x.from).sort()[0];
  if(from){for(const e of ev){if(!e.start)continue;const en=e.end&&e.end>=e.start?e.end:e.start;
      const near=e.type==='test'?addDays(e.start,-14):e.start; // テストは2週間前から
      if(en>=from&&near<=R.b)causes.push((e.type==='test'?(e.start>R.b?'定期テストの前（':'定期テスト（'):'')+(e.name||EV_TYPES[e.type])+' '+evRange(e)+(e.type==='test'?'）':''))}}
  const cause=!alerts.length?'':causes.length?causes.join('、'):(ev.length?'不明（学校の予定とは重なっていない）':'不明（学校の予定が未登録）');
  const score=c.att*1+c.lec*2+c.ex*0.3+(pl.lec?Math.min(1.5,c.lec/pl.lec)*3:0);
  let midLeft=0,midReady=0,finLeft=0,finReady=0;
  for(const co of s.courses||[]){if(co.finished)continue;const k=Number(co.koma)||0,d=Math.min(courseDone(s,co),k);
    if(hasMid(co)&&!midPassed(s,co)){midLeft++;if(d>=PART_SIZE)midReady++}
    if(k&&!finPassed(s,co)){finLeft++;if(d>=k)finReady++}}
  return {s,c,p,pl,rt,lastAtt,lastLec,sinceAtt,sinceLec,pace,remain,eta:pace>0&&remain?Math.ceil(remain/pace):null,pend,alerts,cause,score,midLeft,midReady,finLeft,finReady};
}
function anaPrompt(R,rows){
  const L=rows.map(x=>[x.s.name+'（'+x.s.grade+(schoolOf(x.s)?'・'+schoolOf(x.s):'')+'）',
    '登校'+x.c.att+'日（前の期間'+x.p.att+'）','受講'+x.c.lec+'コマ（前'+x.p.lec+'）'+(x.pl.lec?'・予定'+x.pl.lec:''),'高マス'+x.c.ex,
    '修了率'+(x.rt?Math.round(x.rt.r*100)+'%':'-'),x.lastAtt?'最終登校'+md(x.lastAtt):'登校記録なし',x.alerts.length?'気になる点:'+x.alerts.map(a=>a.txt).join('/'):'',x.cause?'学校の予定:'+x.cause:'',x.pend.length?'受けるべきテスト:'+x.pend.join('/'):''].filter(Boolean).join(' ')).join('\n');
  return '塾（東進）の担任助手チーム向けに、生徒の受講・高マス（高速基礎マスター）・登校の記録をまとめた分析コメントを書いてください。期間：'+md(R.a)+'〜'+md(R.b)+'（'+R.n+'日間、比較は直前の同じ長さの期間）。\n\n'+L+
  '\n\n書き方：日本語で、見出し付きの短い箇条書き。見出しは「全体の様子」「気になる生徒」「よく頑張っている生徒」「原因の見立て」「担任助手への提案」の5つ。原因は、上に書いた学校の予定（定期テスト・文化祭・体育祭など）から言えることだけを書き、それ以外は「不明」とする。上のデータにない事実は作らない。全体で600字程度。';
}
async function runAnaAI(){
  if(!S.sample||!S.sample.text)return;

  catch(e){S.anaErr=e&&e.code==='bad_request'?'中継役（Cloudflare）のプログラムの更新が必要です。管理者に伝えてください。':impErr(e)||'うまくいきませんでした。もう一度押してください。'}

}

// Firestore を、これまでの保存のしかた（doc / collection / onSnapshot）に合わせて包む
function fsAdapter(fs){
  const snapDoc=x=>({id:x.id,exists:x.exists,data:()=>x.data(),metadata:x.metadata});
  const wrapDoc=ref=>({id:ref.id,path:ref.path,
    get:()=>ref.get().then(snapDoc),
    set:d=>ref.set(d),
    update:d=>ref.set(d,{merge:true}),   // 入れ子の項目は残して、書いた項目だけ更新
    delete:()=>ref.delete(),
    onSnapshot:(n,e)=>ref.onSnapshot(x=>n(snapDoc(x)),e)});
  return {doc:p=>wrapDoc(fs.doc(p)),
    collection:p=>({onSnapshot:(n,e)=>fs.collection(p).onSnapshot(q=>n({docs:q.docs.map(snapDoc),size:q.size,empty:q.empty}),e)})};
}
// 写真の読み取り：Apps Script の中継（READ_URL）経由で Claude API に送る
const blobToB64=b=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(b)});
function parseJsonLoose(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {code:'invalid_json'}}
function makeReader(url){
  const call=async(body,signal)=>{const u=firebase.auth().currentUser;if(!u)throw {code:'not_granted'};
    let r;try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:await u.getIdToken(),...body}),signal})}
    catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
    let j;try{j=await r.json()}catch(e){throw {code:'upstream_error'}}
    if(j.error)throw {code:({auth:'not_granted',rate_limited:'rate_limited',refused:'refused',no_key:'sampling_disabled',bad_request:'bad_request'})[j.error]||'upstream_error'};
    return j};
  return {text:async(prompt)=>{const j=await call({mode:'text',prompt,images:[]});return String(j.text||'').trim()},
  json:async(prompt,opt)=>{
  const u=firebase.auth().currentUser;if(!u)throw {code:'not_granted'};
  const idToken=await u.getIdToken();
  const images=await Promise.all([...(opt.images||[])].map(blobToB64));
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken,prompt,images}),signal:opt.signal})}
  catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
  let j;try{j=await r.json()}catch(e){throw {code:'upstream_error'}}
  if(j.error)throw {code:({auth:'not_granted',rate_limited:'rate_limited',refused:'refused',no_key:'sampling_disabled'})[j.error]||'upstream_error'};
  if(j.stop_reason==='max_tokens')throw {code:'invalid_json'};
  return parseJsonLoose(j.text);
}}}

  db.collection('students').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={id:d.id,...clone(d.data())}});S.students=o;S.loaded.students=true;render()},onErr);
  db.collection('days').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.days=o;overlay('days');S.loaded.days=true;render()},onErr);
  db.collection('pdays').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.pdays=o;overlay('pdays');S.loaded.plans=true;render()},onErr);
  db.collection('schools').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.schools=o;render()},onErr);
  db.doc('settings/analysis').onSnapshot(d=>{S.anaAI=d.exists?d.data():null;render()},onErr);
  db.doc('settings/main').onSnapshot(d=>{if(d.exists){const w=d.data().weekStartDow;if(w!=null&&w!==S.settings.weekStartDow){S.settings={...S.settings,weekStartDow:w}}}render()},onErr);
}

// ホーム画面アプリ：オフラインでも画面が開くように
if('serviceWorker' in navigator){
  // 新しい版が届いたら一度だけ読み込み直す（Dock やホーム画面のアプリにもすぐ反映）
  let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
</body>
